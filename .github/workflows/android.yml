# Construit l'application Android à chaque envoi sur GitHub.
# Le fichier .apk est ensuite téléchargeable dans l'onglet « Actions » du dépôt.
name: Application Android

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build && npx cap sync android
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: biblio-vss-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
