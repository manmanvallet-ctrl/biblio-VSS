# Publie la version web (navigateur) sur GitHub Pages à chaque modification de main.
# À activer une fois : Settings → Pages → Source : « GitHub Actions ».
#
# Deux étapes séparées (comme dans les modèles officiels de GitHub) :
#   1. « build » prépare le site et dépose le paquet « github-pages » ;
#   2. « deploy » ne démarre qu'une fois ce dépôt terminé et enregistré, puis publie.
# Avec une seule étape, la publication cherchait parfois le paquet avant que
# GitHub l'ait enregistré (« No artifacts named github-pages were found »).
name: Site web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # ne jamais couper une publication en cours

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: node scripts/build-web.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
