# Met à jour les notes SensCritique une fois par mois (le 1er, vers 5h20 heure de Paris).
# On peut aussi la lancer à la main : onglet « Actions » → « Notes SensCritique » → « Run workflow ».
# Les notes modifiées sont enregistrées directement sur la branche principale.
name: Notes SensCritique

on:
  schedule:
    - cron: "23 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/maj-notes-senscritique.js
      - name: Enregistrer les changements
        run: |
          if git diff --quiet data/ressources.json; then
            echo "Aucune note n'a changé."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ressources.json
          git commit -m "Mise à jour mensuelle des notes SensCritique"
          git push
